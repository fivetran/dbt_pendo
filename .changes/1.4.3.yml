version: 1.4.3
pr_number: 53
under_the_hood:
- Documents the `latest_account_index`, `latest_guide_index`, `latest_page_index`,
  and `latest_visitor_index` columns in `pendo__account`, `pendo__guide`, `pendo__page`,
  and `pendo__visitor`. The models already select these columns, but the documentation
  left them out.
- Removes `disabled_at` from `stg_pendo__application_history`. The source `application_history`
  table has this column, but the model does not select it.
