version: 1.4.2
pr_number: 52
bug_fixes:
- description: '`dbt compile` fails on a new schema because the `int_pendo__guide_daily_metrics`, `int_pendo__guide_alltime_metrics`, and `int_pendo__calendar_spine` models query package-built tables before they exist. These models now run those queries only during `dbt run` and `dbt build`. The calendar spine also falls back to 2016-01-01 when `stg_pendo__application_history` is empty.'
under_the_hood:
- description: Adds `dbt_utils.unique_combination_of_columns` tests to the staging and end models. The tests use the `arguments` syntax introduced in dbt v1.10, which the new v1.11.0 minimum supports.
date: '2026-11-12'
